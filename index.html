<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF3E6" />
    <title>오늘운 · 사주로 보는 오늘의 나</title>
    <meta name="description" content="사주로 보는 오늘의 나" />

    <!--
      단톡방에 링크만 덩그러니 뜨면 아무도 안 누른다. 미리보기 카드가 곧 유입이다.
      카카오는 SVG를 안 읽어서 og:image는 PNG로 둔다. 절대 URL이어야 크롤러가 받아간다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="오늘운" />
    <meta property="og:title" content="오늘운" />
    <meta property="og:description" content="사주로 보는 오늘의 나" />
    <meta property="og:url" content="https://oneulun.vercel.app/" />
    <meta property="og:image" content="https://oneulun.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* 낭만있구미체 (구미시). 임베딩 허용 · 눈누 공식 웹폰트 */
      @font-face {
        font-family: 'RomanticGumi';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/GumiRomanceTTF.woff2')
          format('woff2');
        font-weight: 400;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
